name: Validate keyboard config

on:
  workflow_dispatch:
  push:
    paths:
      - "keyboard.toml"
      - "vial.json"
      - ".github/workflows/config-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate keyboard.toml and vial.json consistency
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path

          root = Path('.')
          with open(root / 'keyboard.toml', 'rb') as f:
              cfg = tomllib.load(f)
          with open(root / 'vial.json', 'r', encoding='utf-8') as f:
              vial = json.load(f)

          layout = cfg['layout']
          rows = layout['rows']
          cols = layout['cols']

          keymap_layers = cfg['keymap']['layers']
          layers = cfg['keymap']['layer']
          assert len(layers) == keymap_layers, f"keymap.layers={keymap_layers}, but found {len(layers)} layer blocks"

          for idx, layer in enumerate(layers):
              keys_rows = [r for r in (line.strip() for line in layer['keys'].strip().splitlines()) if r]
              assert len(keys_rows) == rows, f"Layer {idx}: expected {rows} rows, got {len(keys_rows)}"
              for r_i, r in enumerate(keys_rows):
                  key_count = len(r.split())
                  assert key_count == cols, f"Layer {idx} row {r_i}: expected {cols} cols, got {key_count}"

          matrix = vial['matrix']
          assert matrix['rows'] == rows, f"vial.json matrix rows {matrix['rows']} != keyboard.toml layout rows {rows}"
          assert matrix['cols'] == cols, f"vial.json matrix cols {matrix['cols']} != keyboard.toml layout cols {cols}"

          vial_rows = vial['layouts']['keymap']
          assert len(vial_rows) == rows, f"vial keymap rows {len(vial_rows)} != layout rows {rows}"
          for r_i, row in enumerate(vial_rows):
              key_positions = [item for item in row if isinstance(item, str)]
              assert len(key_positions) == cols, f"vial keymap row {r_i} key positions {len(key_positions)} != layout cols {cols}"

          expected_positions = {f"{r},{c}" for r in range(rows) for c in range(cols)}
          actual_positions = []
          for row in vial_rows:
              actual_positions.extend(item for item in row if isinstance(item, str))

          assert len(actual_positions) == rows * cols, f"vial key positions count {len(actual_positions)} != expected {rows * cols}"
          assert len(set(actual_positions)) == len(actual_positions), "vial key positions contain duplicates"
          assert set(actual_positions) == expected_positions, "vial key positions do not match keyboard.toml layout coordinates"


          print('Config consistency checks passed')
          PY
