# Documentation: https://rmk.rs/docs/configuration/
# Miryoku (Colemak-DH) on a 5x12 Charybdis: 3x5 alphas + 3 thumbs per side,
# with the extra number row, outer columns, and trackball mouse buttons kept.
[keyboard]
name = "RMK Charybdis Split"
product_name = "Charybdis Split"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Salahuddeen"
chip = "rp2040"

[split]
connection = "serial"

[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
serial = [
    { instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_0" },
]

[split.central.matrix]
row_pins = ["PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15"]
col_pins = ["PIN_10", "PIN_9", "PIN_8", "PIN_7", "PIN_6", "PIN_5"]
row2col = true

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
serial = [
    { instance = "PIO0", tx_pin = "PIN_0", rx_pin = "PIN_0" },
]

[split.peripheral.matrix]
row_pins = ["PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15"]
col_pins = ["PIN_10", "PIN_9", "PIN_8", "PIN_7", "PIN_6", "PIN_5"]
row2col = true

[[split.peripheral.input_device.pmw3610]]
name = "right_trackball"
id = 1
spi = { instance = "bitbang0", sck = "PIN_2", mosi = "PIN_3", miso = "PIN_3", cs = "PIN_4" }
motion = "PIN_1"
report_hz = 125
cpi = 800
smart_mode = true
swap_xy = true
invert_x = true
invert_y = true

[layout]
rows = 5
cols = 12
map = """
(0,0,L) (0,1,L) (0,2,L) (0,3,L) (0,4,L) (0,5,L) [1] (0,6,R) (0,7,R) (0,8,R) (0,9,R) (0,10,R) (0,11,R)
(1,0,L) (1,1,L) (1,2,L) (1,3,L) (1,4,L) (1,5,L) [1] (1,6,R) (1,7,R) (1,8,R) (1,9,R) (1,10,R) (1,11,R)
(2,0,L) (2,1,L) (2,2,L) (2,3,L) (2,4,L) (2,5,L) [1] (2,6,R) (2,7,R) (2,8,R) (2,9,R) (2,10,R) (2,11,R)
(3,0,L) (3,1,L) (3,2,L) (3,3,L) (3,4,L) (3,5,L) [1] (3,6,R) (3,7,R) (3,8,R) (3,9,R) (3,10,R) (3,11,R)
(4,0,L) (4,1,L) (4,2,L) (4,3,L) (4,4,L) (4,5,L) [1] (4,6,R) (4,7,R) (4,8,R) (4,9,R) (4,10,R) (4,11,R)
"""

[keymap]
layers = 8

[aliases]
URedo = "WM(Y,LCtrl)"
UPaste = "WM(V,LCtrl)"
UCopy = "WM(C,LCtrl)"
UCut = "WM(X,LCtrl)"
UUndo = "WM(Z,LCtrl)"
Alt1 = "WM(Kc1,LAlt)"
Alt2 = "WM(Kc2,LAlt)"
Alt3 = "WM(Kc3,LAlt)"

# Layer 0: Miryoku Base (Colemak-DH) + GACS home-row mods
# Extra: Esc + 1-0 + Bspc number row (persists on all layers);
# left Tab/Shift/Gui/Ctrl; right Alt+1 / Alt+2 / TG(qwerty)
[[keymap.layer]]
name = "base"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
Tab Q W F P B J L U Y Quote @Alt1
LShift MT(A,LGui,HRM) MT(R,LAlt,HRM) MT(S,LCtrl,HRM) MT(T,LShift,HRM) G M MT(N,RShift,HRM) MT(E,RCtrl,HRM) MT(I,RAlt,HRM) MT(O,RGui,HRM) @Alt2
LGui Z X C D V K H Comma Dot Slash TG(qwerty)
LCtrl LT(media,Escape,FH) LT(nav,Space,FH) LT(mouse,Tab,FH) MouseBtn1 MouseBtn2 LT(fun,LAlt,FH) LT(num,Enter,FH) LT(sym,Backspace,FH) No No No
"""

# Layer 1: Miryoku Nav
[[keymap.layer]]
name = "nav"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ Bootloader Reboot No No @URedo @UPaste @UCopy @UCut @UUndo No _
_ LGui LAlt LCtrl LShift CapsWordToggle Left Down Up Right CapsWordToggle _
_ No No No No No Insert Home PageDown PageUp End _
_ _ _ _ _ _ Enter Backspace Delete No No No
"""

# Layer 2: Miryoku Mouse (also auto-activated by the trackball)
[[keymap.layer]]
name = "mouse"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ No No No No No @URedo @UPaste @UCopy @UCut @UUndo _
_ LGui LAlt LCtrl LShift No MouseLeft MouseDown MouseUp MouseRight No _
_ No No No No No MouseWheelLeft MouseWheelDown MouseWheelUp MouseWheelRight No _
_ _ _ _ _ _ MouseBtn1 MouseBtn3 MouseBtn2 No No No
"""

# Layer 3: Miryoku Media
[[keymap.layer]]
name = "media"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ No No No No No No No No No No _
_ LGui LAlt LCtrl LShift No MediaPrevTrack AudioVolDown AudioVolUp MediaNextTrack No _
_ No No No No No No BrightnessDown BrightnessUp No No _
_ _ _ _ _ _ MediaStop MediaPlayPause AudioMute No No No
"""

# Layer 4: Miryoku Num
[[keymap.layer]]
name = "num"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ LeftBracket Kc7 Kc8 Kc9 RightBracket No No No No Bootloader _
_ Semicolon Kc4 Kc5 Kc6 Equal No RShift RCtrl RAlt RGui _
_ Grave Kc1 Kc2 Kc3 Backslash No No No No Reboot _
_ Dot Kc0 Minus _ _ _ _ _ No No No
"""

# Layer 5: Miryoku Sym
[[keymap.layer]]
name = "sym"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ SHIFTED(LeftBracket) SHIFTED(Kc7) SHIFTED(Kc8) SHIFTED(RightBracket) SHIFTED(Kc9) No No No No No _
_ SHIFTED(Semicolon) SHIFTED(Kc4) SHIFTED(Kc5) SHIFTED(Kc6) SHIFTED(Equal) No RShift RCtrl RAlt RGui _
_ SHIFTED(Grave) SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Backslash) No No No No No _
_ SHIFTED(Kc9) SHIFTED(Kc0) SHIFTED(Minus) _ _ _ _ _ No No No
"""

# Layer 6: Miryoku Fun
[[keymap.layer]]
name = "fun"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
_ F12 F7 F8 F9 PrintScreen No No No No Bootloader _
_ F11 F4 F5 F6 ScrollLock No No No No No _
_ F10 F1 F2 F3 Pause No No No No Reboot _
_ Application Space Tab _ _ _ _ _ No No No
"""

# Layer 7: Guest QWERTY (no home-row mods, no Miryoku LTs)
[[keymap.layer]]
name = "qwerty"
keys = """
Escape Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 BackSpace
Tab Q W E R T Y U I O P @Alt1
LShift A S D F G H J K L Semicolon @Alt2
LGui Z X C V B N M Comma Dot Slash TG(qwerty)
LCtrl Escape Space Tab MouseBtn1 MouseBtn2 LAlt Enter Backspace No No No
"""

# Home-row mods and thumb hold-taps. See https://rmk.rs/docs/configuration/behavior
[behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
hold_timeout = "250ms"
gap_timeout = "250ms"

[behavior.morse.profiles]
HRM = { unilateral_tap = true, permissive_hold = true, hold_timeout = "250ms", gap_timeout = "250ms" }
FH = { hold_on_other_press = true, unilateral_tap = false, hold_timeout = "200ms", gap_timeout = "200ms" }

# Trackball motion raises the Mouse layer. See https://rmk.rs/docs/configuration/behavior
[[behavior.auto_mouse_layer]]
device_id = 1
target_layer = 2
timeout = "600ms"
threshold = 2
